<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a73e8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="920" fill="#ffffff"/>

  <text x="40" y="44" font-size="20" font-weight="bold" fill="#202124">课程 Agent 助教 · 端云交互总览 v0.2【整图属阶段二】</text>
  <text x="40" y="66" font-size="12" fill="#5f6368">设计阶段产出 · 2026-09-15 · 阶段一不联任何服务端，本图不作为阶段一开工依据 · 本地内部细节见《本地 Agent 详图》</text>
  <rect x="40" y="80" width="18" height="12" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="64" y="90" font-size="12" fill="#202124">我们负责</text>
  <rect x="150" y="80" width="18" height="12" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="174" y="90" font-size="12" fill="#202124">数据存储</text>
  <rect x="250" y="80" width="18" height="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="274" y="90" font-size="12" fill="#202124">复用社区扩展</text>
  <rect x="430" y="80" width="18" height="12" fill="#ffffff" stroke="#5f6368" stroke-dasharray="4 3"/>
  <text x="454" y="90" font-size="12" fill="#202124">外部第三方</text>

  <!-- ===================== 左：本地端 ===================== -->
  <rect x="40" y="100" width="520" height="640" rx="14" fill="#f8f9fa" stroke="#c0c4c9" stroke-width="1.5"/>
  <text x="56" y="124" font-size="16" font-weight="bold" fill="#202124">学生电脑（本地端）</text>

  <rect x="70" y="150" width="80" height="36" rx="18" fill="#ffffff" stroke="#5f6368"/>
  <text x="110" y="173" font-size="13" text-anchor="middle" fill="#202124">学生</text>
  <line x1="110" y1="186" x2="110" y2="206" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="70" y="210" width="460" height="180" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="86" y="236" font-size="15" font-weight="bold" fill="#174ea6">本地应用（Electron 桌面端）</text>
  <rect x="380" y="218" width="136" height="20" rx="10" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="448" y="232" font-size="10.5" text-anchor="middle" fill="#b06000">细节见《本地详图》</text>
  <text x="86" y="266" font-size="12.5" fill="#202124">渲染进程：GUI ｜ 主进程：Agent 宿主（pi 内核）</text>
  <text x="86" y="288" font-size="12.5" fill="#202124">权限闸 · 工具集 · subagent 编排</text>
  <text x="86" y="310" font-size="12.5" fill="#202124">模型调用：学生 key 直连供应商</text>
  <text x="86" y="332" font-size="11.5" fill="#5f6368">（组件与数据流见《本地 Agent 详图》）</text>

  <rect x="170" y="420" width="360" height="100" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="186" y="444" font-size="13" font-weight="bold" fill="#3c4043">仅存本地 · 永不上传</text>
  <text x="186" y="468" font-size="12" fill="#202124">会话 JSONL · 项目代码 · 课程 token</text>
  <text x="186" y="486" font-size="12" fill="#202124">权限档位 · 审计日志</text>
  <text x="186" y="504" font-size="11" fill="#5f6368">（学生之间天然隔离的根基）</text>

  <rect x="70" y="550" width="460" height="90" rx="10" fill="#ffffff" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="86" y="574" font-size="13" font-weight="bold" fill="#3c4043">大模型 API（学生自选供应商）</text>
  <text x="86" y="596" font-size="12" fill="#202124">学生自己的 key 直连调用</text>
  <text x="86" y="614" font-size="12" fill="#202124">内容不经手服务端 · 服务端不可见</text>

  <path d="M 70 300 L 56 300 L 56 596 L 66 596" fill="none" stroke="#5f6368" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="50" y="450" font-size="11" fill="#5f6368" transform="rotate(-90 50 450)" text-anchor="middle">学生 key 直连</text>

  <!-- ===================== 右：服务端 ===================== -->
  <rect x="880" y="100" width="480" height="640" rx="14" fill="#f8f9fa" stroke="#c0c4c9" stroke-width="1.5"/>
  <text x="896" y="124" font-size="16" font-weight="bold" fill="#202124">服务端</text>
  <rect x="1180" y="108" width="170" height="22" rx="11" fill="#ffffff" stroke="#9aa0a6"/>
  <text x="1265" y="123" font-size="11" text-anchor="middle" fill="#3c4043">部署：自租云主机（暂定）</text>

  <rect x="1150" y="140" width="150" height="36" rx="18" fill="#ffffff" stroke="#5f6368"/>
  <text x="1225" y="163" font-size="13" text-anchor="middle" fill="#202124">老师（浏览器）</text>
  <line x1="1225" y1="176" x2="1225" y2="196" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 1300 158 L 1352 158 L 1352 470 L 1344 470" fill="none" stroke="#5f6368" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="1352" y="320" font-size="11" fill="#5f6368" transform="rotate(90 1352 320)" text-anchor="middle">期末查看记录</text>

  <rect x="900" y="200" width="440" height="96" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="916" y="224" font-size="14" font-weight="bold" fill="#174ea6">知识库服务</text>
  <text x="916" y="248" font-size="12" fill="#202124">上传 PPT / PDF / Markdown · 解析 · 切分 · 索引</text>
  <text x="916" y="266" font-size="12" fill="#202124">出处元数据：文件名 + 页码 · 代码块不切碎</text>
  <text x="916" y="284" font-size="12" fill="#202124">向量化：商用 embedding API + FTS5 混合检索</text>

  <rect x="900" y="326" width="440" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="916" y="350" font-size="14" font-weight="bold" fill="#174ea6">检索服务</text>
  <text x="916" y="372" font-size="12" fill="#202124">问题 → 相关片段 + 出处</text>
  <text x="916" y="390" font-size="12" fill="#202124">标准答案、题库不在此通道返回</text>

  <rect x="900" y="432" width="440" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="916" y="456" font-size="14" font-weight="bold" fill="#174ea6">记录服务</text>
  <text x="916" y="478" font-size="12" fill="#202124">提问 / 反馈 / 拦截事件存档</text>
  <text x="916" y="496" font-size="12" fill="#202124">学生可查自己的 · 老师期末导出</text>

  <rect x="900" y="538" width="440" height="76" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="916" y="562" font-size="14" font-weight="bold" fill="#174ea6">接入服务</text>
  <text x="916" y="584" font-size="12" fill="#202124">课程邀请码 · 学生登记（姓名学号）</text>
  <text x="916" y="602" font-size="12" fill="#202124">签发本地 token</text>

  <rect x="900" y="644" width="440" height="80" rx="10" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="916" y="668" font-size="13" font-weight="bold" fill="#3c4043">存储（SQLite）</text>
  <text x="916" y="690" font-size="12" fill="#202124">资料 · 索引 · 课程与学生 · 记录</text>
  <text x="916" y="708" font-size="12" fill="#202124">标准答案与题库仅存于此，不落学生盘</text>

  <!-- 服务 -> 存储总线（左侧） -->
  <path d="M 900 248 L 888 248 L 888 684 L 896 684" fill="none" stroke="#9aa0a6" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M 900 364 L 888 364" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <path d="M 900 484 L 888 484" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <path d="M 900 596 L 888 596" fill="none" stroke="#9aa0a6" stroke-width="1.4"/>
  <circle cx="888" cy="364" r="2.5" fill="#9aa0a6"/>
  <circle cx="888" cy="484" r="2.5" fill="#9aa0a6"/>
  <circle cx="888" cy="596" r="2.5" fill="#9aa0a6"/>

  <!-- ===================== 跨端通道 ===================== -->
  <path d="M 530 340 L 688 340 A 12 12 0 0 1 712 340 L 892 340" fill="none" stroke="#1a73e8" stroke-width="1.6" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="560" y="330" font-size="12" font-weight="bold" fill="#1a73e8">① 检索请求（问题）→</text>
  <text x="892" y="330" font-size="11.5" fill="#1a73e8" text-anchor="end">← 片段 + 出处</text>
  <text x="866" y="332" font-size="12" font-weight="bold" fill="#1a73e8">①</text>

  <path d="M 530 250 L 700 250 L 700 576 L 896 576" fill="none" stroke="#1a73e8" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="556" y="242" font-size="12" font-weight="bold" fill="#1a73e8">② 激活（一次性）</text>
  <text x="694" y="420" font-size="11.5" fill="#1a73e8" text-anchor="end">邀请码 + 姓名学号 → token</text>
  <text x="866" y="568" font-size="12" font-weight="bold" fill="#1a73e8">②</text>

  <path d="M 530 456 L 896 456" fill="none" stroke="#1a73e8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <text x="560" y="478" font-size="12" font-weight="bold" fill="#1a73e8">③ 记录上报（异步 · 攒批 · 可关）</text>
  <text x="866" y="448" font-size="12" font-weight="bold" fill="#1a73e8">③</text>

  <!-- ===================== 典型时序 ===================== -->
  <text x="40" y="782" font-size="14" font-weight="bold" fill="#202124">典型时序（三段 · 区别于「交付阶段一/二」）</text>
  <rect x="60" y="794" width="400" height="96" rx="10" fill="#f8f9fa" stroke="#c0c4c9"/>
  <text x="76" y="818" font-size="13" font-weight="bold" fill="#202124">时序 ① 开课激活</text>
  <text x="76" y="840" font-size="12" fill="#202124">学生：邀请码激活（②）→ token 落本地</text>
  <text x="76" y="858" font-size="12" fill="#202124">告知同意（首次）· 配置 API key</text>
  <text x="76" y="876" font-size="12" fill="#202124">老师：上传资料 → 解析建索引</text>
  <line x1="464" y1="842" x2="494" y2="842" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="500" y="794" width="400" height="96" rx="10" fill="#f8f9fa" stroke="#c0c4c9"/>
  <text x="516" y="818" font-size="13" font-weight="bold" fill="#202124">时序 ② 日常答疑</text>
  <text x="516" y="840" font-size="12" fill="#202124">提问 → ① 检索 → 带出处回答</text>
  <text x="516" y="858" font-size="12" fill="#202124">模型调用：学生 key 直连供应商</text>
  <text x="516" y="876" font-size="12" fill="#202124">事件持续 ③ 上报（可关 · 可查）</text>
  <line x1="904" y1="842" x2="934" y2="842" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="940" y="794" width="400" height="96" rx="10" fill="#f8f9fa" stroke="#c0c4c9"/>
  <text x="956" y="818" font-size="13" font-weight="bold" fill="#202124">时序 ③ 期末复盘</text>
  <text x="956" y="840" font-size="12" fill="#202124">老师：从记录服务导出提问热点</text>
  <text x="956" y="858" font-size="12" fill="#202124">学生：查看 / 关闭自己的上报</text>
  <text x="956" y="876" font-size="12" fill="#202124">知识库依据使用情况再评估补充</text>
</svg>
