<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1120" fill="#ffffff"/>

  <text x="40" y="44" font-size="20" font-weight="bold" fill="#202124">课程 Agent 助教 · 本地 Agent 详细设计 v0.2（阶段一）</text>
  <text x="40" y="66" font-size="12" fill="#5f6368">只含学生本地部分 · 2026-09-15 · 标【阶段二】的部分本阶段不做 · 服务端见《端云交互总览》</text>
  <rect x="40" y="80" width="18" height="12" fill="#e6f4ea" stroke="#188038"/>
  <text x="64" y="90" font-size="12" fill="#202124">pi 现成</text>
  <rect x="150" y="80" width="18" height="12" fill="#e8f0fe" stroke="#1a73e8"/>
  <text x="174" y="90" font-size="12" fill="#202124">我们开发</text>
  <rect x="260" y="80" width="18" height="12" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="284" y="90" font-size="12" fill="#202124">复用社区扩展</text>
  <rect x="420" y="80" width="18" height="12" fill="#f1f3f4" stroke="#9aa0a6"/>
  <text x="444" y="90" font-size="12" fill="#202124">数据</text>
  <rect x="510" y="80" width="18" height="12" fill="#ffffff" stroke="#5f6368" stroke-dasharray="4 3"/>
  <text x="534" y="90" font-size="12" fill="#202124">系统外部（详见端云图）</text>

  <!-- ===================== A. GUI 前端 ===================== -->
  <rect x="40" y="100" width="1320" height="200" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="56" y="126" font-size="15" font-weight="bold" fill="#174ea6">GUI 前端（Electron 渲染进程）</text>

  <rect x="60" y="140" width="290" height="144" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="74" y="162" font-size="13" font-weight="bold" fill="#174ea6">对话视图</text>
  <text x="74" y="184" font-size="11.5" fill="#202124">消息流 · 流式渲染</text>
  <text x="74" y="202" font-size="11.5" fill="#202124">subagent 过程树（实时可见）</text>
  <text x="74" y="220" font-size="11.5" fill="#202124">出处卡片（资料名 + 页码）【阶段二】</text>
  <text x="74" y="238" font-size="11.5" fill="#202124">一键反馈（回答不对劲时）【阶段二】</text>

  <rect x="365" y="140" width="290" height="144" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="379" y="162" font-size="13" font-weight="bold" fill="#174ea6">会话中心</text>
  <text x="379" y="184" font-size="11.5" fill="#202124">会话列表 + 状态标记</text>
  <text x="379" y="202" font-size="11.5" fill="#202124">（空闲 / 运行中 / 待确认）</text>
  <text x="379" y="220" font-size="11.5" fill="#202124">历史会话入口（pi -r 界面化）</text>
  <text x="379" y="238" font-size="11.5" fill="#202124">新建 / 切换（切换不销毁实例）</text>

  <rect x="670" y="140" width="290" height="144" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="684" y="162" font-size="13" font-weight="bold" fill="#174ea6">权限中心</text>
  <text x="684" y="184" font-size="11.5" fill="#202124">三档设置（默认：变更前确认）</text>
  <text x="684" y="202" font-size="11.5" fill="#202124">确认弹窗（含 subagent 动作）</text>
  <text x="684" y="220" font-size="11.5" fill="#202124">动作日志：全部可见可追溯</text>
  <text x="684" y="238" font-size="11.5" fill="#202124">档位管先不先问，不管告不告诉你</text>

  <rect x="975" y="140" width="355" height="144" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="989" y="162" font-size="13" font-weight="bold" fill="#174ea6">激活与设置</text>
  <text x="989" y="184" font-size="11.5" fill="#202124">激活向导：课程邀请码 + 姓名学号【阶段二】</text>
  <text x="989" y="202" font-size="11.5" fill="#202124">告知同意（首次 · 文案从简）【阶段二】</text>
  <text x="989" y="220" font-size="11.5" fill="#202124">API key 配置（学生自选供应商）【阶段一】</text>
  <text x="989" y="238" font-size="11.5" fill="#202124">课程工作区目录展示【阶段一】</text>

  <!-- GUI <-> 服务层 -->
  <line x1="350" y1="304" x2="350" y2="336" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="342" y="324" font-size="11.5" text-anchor="end" fill="#5f6368">指令上行（IPC）：提问 · steer · 确认 · 档位 · 会话操作</text>
  <line x1="1050" y1="336" x2="1050" y2="304" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1058" y="324" font-size="11.5" fill="#5f6368">事件下行（IPC 推送）：流式 · 工具 · subagent · 状态</text>

  <!-- ===================== B. 本地服务层 ===================== -->
  <rect x="40" y="340" width="1320" height="560" rx="12" fill="#f8f9fa" stroke="#c0c4c9" stroke-width="1.5"/>
  <text x="56" y="364" font-size="15" font-weight="bold" fill="#202124">Electron 主进程（Node · 承载以下模块）</text>

  <!-- B1 Agent 宿主 -->
  <rect x="60" y="384" width="640" height="190" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="76" y="408" font-size="14" font-weight="bold" fill="#0d652d">Agent 宿主（SDK 内嵌 pi-agent-core / pi-coding-agent）</text>

  <rect x="76" y="418" width="608" height="56" rx="6" fill="#dce7f8" stroke="#1a73e8"/>
  <text x="88" y="438" font-size="11.5" fill="#174ea6">实例池：每会话一实例 · 懒创建 · 切换会话不销毁（后台任务继续跑）</text>
  <text x="88" y="456" font-size="11.5" fill="#174ea6">空闲约 10 分钟 LRU 回收 · 运行中永不回收 · 重建 = 读账本，秒级复活</text>

  <rect x="76" y="482" width="608" height="40" rx="6" fill="#d3e9da" stroke="#188038"/>
  <text x="88" y="506" font-size="11.5" fill="#0d652d">会话装配器：pi SessionManager 读 JSONL → 组装上下文 → 构造实例（历史会话入口的数据源）</text>

  <text x="76" y="548" font-size="11.5" fill="#0d652d">事件总线：实例事件流 → GUI；steer / followUp / abort 接口（GUI 指令的落点）</text>
  <text x="76" y="566" font-size="11.5" fill="#5f6368">会话落盘：JSONL 分支树 · 自动压缩 · 按课程工作区目录隔离（pi 现成）</text>

  <!-- B2 subagent -->
  <rect x="720" y="384" width="620" height="190" rx="10" fill="#ffffff" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="736" y="408" font-size="14" font-weight="bold" fill="#b06000">子代理（复用 pi-subagents · 混合进程模型）</text>

  <rect x="740" y="418" width="280" height="100" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="754" y="440" font-size="13" font-weight="bold" fill="#b06000">通用子代理（基座）【阶段一】</text>
  <text x="754" y="462" font-size="11.5" fill="#202124">能力完整 · 承接拆分的复杂任务</text>
  <text x="754" y="480" font-size="11.5" fill="#202124">干完只回传摘要</text>
  <text x="754" y="498" font-size="11.5" fill="#202124">前台=父进程内会话 / 后台=独立进程</text>

  <rect x="1040" y="418" width="280" height="100" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="1054" y="440" font-size="13" font-weight="bold" fill="#b06000">资料检索子代理【阶段二】</text>
  <text x="1054" y="462" font-size="11.5" fill="#202124">基座 + 工具白名单（只留检索）</text>
  <text x="1054" y="480" font-size="11.5" fill="#202124">只读 · 上下文防火墙</text>
  <text x="1054" y="498" font-size="11.5" fill="#202124">防撑爆主 agent 上下文</text>

  <text x="736" y="548" font-size="11.5" fill="#5f6368">派发 ⇄ 汇报：任务结果经事件流回宿主；权限确认请求上报 GUI</text>
  <text x="736" y="566" font-size="11.5" fill="#5f6368">"只读"锁死在工具配置层，不靠提示词</text>

  <line x1="702" y1="479" x2="718" y2="479" stroke="#5f6368" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- 宿主/subagent -> 权限闸 -->
  <line x1="380" y1="574" x2="380" y2="592" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="388" y="587" font-size="11" fill="#5f6368">工具调用</text>
  <line x1="1030" y1="574" x2="1030" y2="592" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1038" y="587" font-size="11" fill="#5f6368">subagent 工具调用</text>

  <!-- B3 权限闸 -->
  <rect x="60" y="596" width="1280" height="130" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="76" y="620" font-size="14" font-weight="bold" fill="#174ea6">权限闸【阶段一】（扩展层 tool_call · 复用社区权限扩展 + 自研审批排队 · 主 / 子代理共用同一道闸）</text>

  <rect x="76" y="632" width="170" height="64" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="86" y="654" font-size="12" font-weight="bold" fill="#174ea6">拦截点</text>
  <text x="86" y="672" font-size="11" fill="#202124">所有工具调用必经</text>
  <line x1="246" y1="664" x2="258" y2="664" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="262" y="632" width="230" height="64" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="272" y="654" font-size="12" font-weight="bold" fill="#174ea6">白名单 → 直接放行</text>
  <text x="272" y="672" font-size="11" fill="#202124">项目目录内常规读写 · 安全命令</text>
  <line x1="492" y1="664" x2="504" y2="664" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="508" y="632" width="230" height="64" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="518" y="654" font-size="12" font-weight="bold" fill="#174ea6">黑名单 → 弹确认</text>
  <text x="518" y="672" font-size="11" fill="#202124">大面积删除 · 出项目目录 · 联网</text>
  <line x1="738" y1="664" x2="750" y2="664" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="754" y="632" width="230" height="64" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="764" y="654" font-size="12" font-weight="bold" fill="#174ea6">灰区 → 判官小 agent</text>
  <text x="764" y="672" font-size="11" fill="#202124">评危险系数 · 拿不准=危险</text>
  <line x1="984" y1="664" x2="996" y2="664" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="1000" y="632" width="160" height="64" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="1010" y="654" font-size="12" font-weight="bold" fill="#174ea6">三档执行</text>
  <text x="1010" y="672" font-size="11" fill="#202124">按学生所选档位</text>
  <line x1="1160" y1="664" x2="1172" y2="664" stroke="#5f6368" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="1176" y="632" width="164" height="64" rx="6" fill="#ffffff" stroke="#1a73e8"/>
  <text x="1186" y="654" font-size="12" font-weight="bold" fill="#174ea6">审计日志</text>
  <text x="1186" y="672" font-size="11" fill="#202124">全部动作落盘可查</text>

  <!-- 闸 -> 工具集 -->
  <line x1="380" y1="726" x2="380" y2="770" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="388" y="752" font-size="11" fill="#5f6368">放行 / 拦截 / 弹确认</text>
  <line x1="1030" y1="776" x2="1030" y2="732" stroke="#5f6368" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1038" y="760" font-size="11" fill="#5f6368">白名单配置喂给闸</text>

  <!-- B4 工具集 -->
  <text x="76" y="766" font-size="13" font-weight="bold" fill="#202124">工具集</text>
  <rect x="76" y="776" width="360" height="56" rx="8" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="90" y="796" font-size="12.5" font-weight="bold" fill="#0d652d">read / edit / bash（pi 自带）【阶段一】</text>
  <text x="90" y="816" font-size="11.5" fill="#202124">看代码 · 复现报错 · 改文件</text>

  <rect x="452" y="776" width="360" height="56" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="466" y="794" font-size="12.5" font-weight="bold" fill="#174ea6">课程资料检索（自研）【阶段二】</text>
  <text x="466" y="810" font-size="11.5" fill="#202124">→ 服务端 · 超时降级为提示</text>
  <text x="466" y="826" font-size="11" fill="#202124">通道形态：自研扩展工具（pi.registerTool）→ HTTP</text>

  <rect x="828" y="776" width="480" height="56" rx="8" fill="#ffffff" stroke="#1a73e8"/>
  <text x="842" y="794" font-size="12.5" font-weight="bold" fill="#174ea6">子代理工具白名单（配置点）【阶段一】</text>
  <text x="842" y="810" font-size="11.5" fill="#202124">检索子代理：只留检索工具 · 只读【阶段二】</text>
  <text x="842" y="826" font-size="11" fill="#b06000">锁死在工具配置层，不靠提示词</text>

  <!-- B5 服务端客户端 -->
  <rect x="60" y="852" width="1280" height="40" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="76" y="877" font-size="13" font-weight="bold" fill="#174ea6">服务端客户端（自研）【阶段二】</text>
  <text x="250" y="877" font-size="12" fill="#202124">激活 · 检索调用 · 记录上报（本地队列 · 攒批 · 可关 · 学生可查看）</text>

  <!-- ===================== C. 本地数据 ===================== -->
  <path d="M 700 892 L 700 916" fill="none" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="708" y="910" font-size="11" fill="#5f6368">逐条落盘</text>
  <rect x="40" y="920" width="1320" height="80" rx="12" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="56" y="944" font-size="13.5" font-weight="bold" fill="#3c4043">本地数据（仅存本地 · 永不上传）</text>
  <text x="56" y="972" font-size="12" fill="#202124">会话 JSONL（按课程工作区目录）</text>
  <text x="500" y="972" font-size="12" fill="#202124">审计日志（全部动作可追溯）</text>
  <text x="900" y="972" font-size="12" fill="#202124">配置：权限档位 · API key · 课程 token</text>

  <!-- ===================== D. 出口 ===================== -->
  <path d="M 60 872 L 28 872 L 28 1060 L 56 1060" fill="none" stroke="#1a73e8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrB)"/>
  <rect x="60" y="1030" width="600" height="60" rx="10" fill="#ffffff" stroke="#5f6368" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="76" y="1054" font-size="13" font-weight="bold" fill="#3c4043">→ 服务端</text>
  <text x="76" y="1076" font-size="12" fill="#202124">检索 ① / 激活 ② / 上报 ③ —— 详见《端云交互总览》</text>

  <path d="M 1360 420 L 1390 420 L 1390 1000 L 1290 1000 L 1290 1026" fill="none" stroke="#5f6368" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="1378" y="700" font-size="11" fill="#5f6368" transform="rotate(-90 1378 700)" text-anchor="middle">模型调用（学生 key）</text>
  <rect x="700" y="1030" width="600" height="60" rx="10" fill="#ffffff" stroke="#5f6368" stroke-dasharray="6 4" stroke-width="1.5"/>
  <text x="716" y="1054" font-size="13" font-weight="bold" fill="#3c4043">→ 大模型 API</text>
  <text x="716" y="1076" font-size="12" fill="#202124">模型调用：学生 key 直连 · 内容不经手服务端 · 详见端云图</text>
</svg>
